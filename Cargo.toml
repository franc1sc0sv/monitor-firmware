[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/franc1sc0sv/monitor-firmware"

[workspace.dependencies]
libc = "0.2"
proptest = "1.12.0"
sha2 = "0.11"
thiserror = "2"
windows = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
