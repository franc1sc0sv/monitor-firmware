# Installed firmware M-T5534GCPA-1006.0 of the Samsung LC34G55T.
# Facts measured on one unit (see docs/targets/lc34g55t/journal.md). Guards hold SHA-256 of stock bytes, never the bytes.

[identity]
model = "LC34G55T"
version = "1006.0"
version_string = "M-T5534GCPA-1006.0"
ap_sha256 = "0ca44b6850a85fd286bea980fed383d5008376ffe99844e054c48135dff0393e"       # decompressed AP body (loads at load_base)
prefix_sha256 = "9b33f3c4ba40f3d4570d6c2dcd1e947f74ac26340e17d254aba9c07b84b71183"   # 0x3800-byte uncompressed prefix
flash_jedec = "EF4017"                                   # Winbond W25Q64, 8 MB

[container]
descriptor = 0x11000      # u32 LE x10: ap_flash_start, ram_start, ram_end, ap_flash_end, 0, hdr_crc32, 0, 0, filesize-4, 0x11000
prefix_len = 0x3800
len_field = 0x114a        # inside the prefix: prefix + stream + 6
tail_limit = 0x160930     # first non-zero byte after the stock AP region; resources are never moved
ram_base = 0x200000       # prefix loads here
load_base = 0x203800      # decompressed AP body loads here
flash_write_start = 0x11000
flash_write_end = 0x2c0000   # includes the trailer CRC sector 0x2bf000 (filesize-4 = 0x2bfde8); unchanged sectors are skipped

[cave]
start = 0x399820          # end-of-.text padding (0x399817..0x39a000 is zero in the stock image)
end = 0x39a000

[ram]
block = 0x4fe6b0          # 2 KB event/state block (v3)
block_size = 0x800

[symbols]
ddc_service = 0x212fc6
set_vcp_handler = 0x270b45
menu_apply = 0x284884
timer_isr_tail_callee = 0x28ba15
get_vcp_table = 0x377410
get_reply_tail = 0x26fcd3
cfg_ptr = 0x3c41b0
settings_base = 0x204000
# stock routines and variables used by v3.2 (protocol 3); see docs/targets/lc34g55t/tandem-re.md
panel_off = 0x289488
panel_on = 0x289228
audio_mute = 0x28cc75
led_standby = 0x253607
led_on = 0x2535b9
cable_mask = 0x27cede
key_read = 0x28abdc
pm_request = 0x4ca730
pm_countdown = 0x4ca7aa
panel_flag = 0x4ca78a
wake_status = 0x4f82d4
source_detect = 0x20414f

