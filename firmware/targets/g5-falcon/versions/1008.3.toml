# Samsung Odyssey G5 (S32CG552EN / LS32CG552ENXZA), firmware M-C5500GGZA-1008.3.
# Novatek NVTSC_IMG package. Hashes and offsets only; the vendor image stays local (data/vendor/g5/, gitignored).
[version]
model = "S32CG552EN"
version = "1008.3"
source = "Samsung support (Latin, LS32CG552ENXZA): M-C5500GGZA.zip, file M-C5500GGZA-1008.3[C145].img"
image_size = 3449760
image_sha256 = "a03692a23cc882857d28516adc29e8cd2cca78e6b5b6a2c98b8caf0c16a72bd1"
sum16 = "C145"                         # whole-file 16-bit byte-sum (matches the [C145] filename tag)

[embedded]
# Single occurrence of the "M-C5500GGZA-NNNN.N" id; mfw.novatek.restamp() rewrites the NNNN.N digits here.
family_offset = 0x273358               # "M-C5500GGZA-1008.3"
version_digits_offset = 0x273364       # start of "1008.3"

[sites]
# Known patch sites (file offsets). MGA byte corroborated locally: 0x00 here, "Picture" category string adjacent,
# matching the sibling NT68552 RE (github:c8dhjp4tyv-bit/odyssey-g5-firmware-research, for 1010.0). Confidence: inferred.
mga_supported = { at = 0x2D2776, stock = 0x00, note = "00->01 reveals the hidden MGA factory-calibration menu (data-only)" }

# ---------------------------------------------------------------------------------------------------------------
# Production patch, protocol 3 (patches/production_hook.py; evidence in docs/targets/g5-falcon/tandem-re.md).
# Code addresses are nominal VAs (file = VA + 0x2E000; the code runs at VA + 0x320). RAM addresses are absolute.
# "confirmed" = read in the disassembly of this image; hardware behaviour of the patch is still to be measured.
# ---------------------------------------------------------------------------------------------------------------
[production.symbols]
get_call_site = 0x103EBC        # dispatcher 0x103DBC: call to get_vcp (confirmed; hook site proven by dev images)
set_call_site = 0x104170        # dispatcher: call to set_vcp (confirmed; hook site proven by dev images)
get_vcp = 0x1882AC              # SecLibCommon_DdcCmdGetVcp
set_vcp = 0x1869BC              # SecLibCommon_DddCmdSetVcp
get_current_source = 0x1B02C0   # SecLibSource_GetCurrentSecSourceName(window): 0x00 HDMI1, 0x10 DP1 (confirmed)
set_power_state = 0x1ADACC      # SecLibPower_SetPowerState: 0 toggle, 1 off, 2 on, 3 power saving, 5 wake (confirmed)
panel_on_off = 0x18BDE8         # SecLibCommon_PanelOnOffControl(onOff, force2Finish) (confirmed by its own strings)
led_power_on = 0x18A710         # "Set LED for Power On" routine, no arguments (confirmed)
led_power_off = 0x18A830        # "Set LED for Power Off" routine, no arguments (confirmed)
tick_seconds = 0xA8037D2C       # +1 per pass of a main-loop gate, wraps at 86400: seconds (unit inferred)
sync_state = 0xA803B12C         # main window sync state word (confirmed)
sync_locked = 4                 # SEC_SYNC_SYNC_NORMAL (confirmed from the debug table)
cable_state = 0xA803B13C        # u32[2] by source index: [0] HDMI1, [1] DP1; 2 = connected, 1 = not (confirmed)
heap_break = 0xA803C0A0         # C library sbrk pointer; 0 until the first malloc; the heap starts at 0xA803C0A8

[production.ram]
# Inside the C heap's address range (it grows up from 0xA803C0A8 with no limit check). The hook refuses to use the
# block when heap_break is above `ring`, and then answers like stock. 0xA803CFC0 was used by dev images 1020.1..1021.4.
base = 0xA803CC00
ring = 0xA803CDC0               # 64 records x 8 bytes, ends at state
state = 0xA803CFC0              # 16 bytes used

[production.regions]            # nominal VA and size of the code the hook replaces
main = { start = 0x1E14EC, size = 0x280 }
leaf = { start = 0x1E45D4, size = 0x90 }
sample = { start = 0x1E176C, size = 0x114 }
aux = { start = 0x1E1AE4, size = 0x114 }

