[project]
name = "mfw"
version = "0.3.0"
description = "Identify, verify and rebuild MStar MST9U monitor firmware images with guarded patches."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
zopfli = ["zopfli>=0.2"]

[project.scripts]
mfw = "mfw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfw"]
