[project]
name = "monitor-events"
version = "0.2.0"
description = "Read the event log of patched Samsung LC34G55T firmware over DDC/CI (Windows, Linux, macOS)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
monitor-events = "monitor_events.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor_events"]
